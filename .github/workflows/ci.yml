name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate -w apps/api
      - name: Build all workspaces
        run: npm run build
